---

name: ansible

on:
  pull_request:
  push:
    branches:
      - main
      - wip/next

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:

  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ansible/ansible-lint@v26

...
